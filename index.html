<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SURGE — arcade survival shooter</title>

<!-- SEO -->
<meta name="description" content="SURGE is a fast, free browser survival shooter. Hold the line, chain combos, dash through swarms, and see how long you can last. No install — just play.">
<meta name="theme-color" content="#0c0d1a">
<meta name="color-scheme" content="dark">
<link rel="canonical" href="https://surge.paramain.com/">

<!-- Open Graph / social sharing -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="SURGE">
<meta property="og:title" content="SURGE — arcade survival shooter">
<meta property="og:description" content="Hold the line · chain combos · grow stronger. A free browser survival shooter. How long can you last?">
<meta property="og:image" content="https://surge.paramain.com/og.svg">
<meta property="og:url" content="https://surge.paramain.com/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="SURGE — arcade survival shooter">
<meta name="twitter:description" content="Hold the line · chain combos · grow stronger. Free to play in your browser.">
<meta name="twitter:image" content="https://surge.paramain.com/og.svg">

<!-- Icons / PWA -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div class="topbar">
      <div class="bars">
        <div class="bar"><i id="hpFill"></i><div class="barLabel" id="hpLabel">100 / 100</div></div>
        <div class="bar"><i id="xpFill"></i><div class="barLabel" id="xpLabel" style="color:#072018">LV 1</div></div>
        <div class="bar"><i id="surgeFill"></i><div class="barLabel" id="surgeLabel">SURGE</div></div>
      </div>
      <div class="stats">
        <div id="timer">0:00</div>
        <div id="comboLine">×1.0</div>
        <div class="substat">KILLS <b id="kills">0</b></div>
        <div class="substat">SCORE <b id="score">0</b></div>
      </div>
      <div id="muteBtn" title="Mute (M)">♪</div>
    </div>
    <div id="dashBtn">SURGE</div>
  </div>
  <canvas id="minimap" width="140" height="105"></canvas>

  <!-- Start -->
  <div id="start" class="screen">
    <div class="title">SURGE</div>
    <div class="tagline">risk is power · one hit resets everything</div>
    <div class="bestline" id="startBest"></div>
    <div class="howto">
      Chain kills to power up. One hit resets everything.<br>
      <span class="key">SPACE</span> surge &nbsp; <span class="key">SHIFT</span> dash &nbsp; <span class="key">WASD</span> move
    </div>
    <button class="btn" id="startBtn">Play</button>
  </div>

  <!-- Level up -->
  <div id="levelup" class="screen hide">
    <div class="lhead">Level Up</div>
    <div class="lsub" id="lsub">Choose one upgrade</div>
    <div class="cards" id="cards"></div>
  </div>

  <!-- Game over -->
  <div id="over" class="screen hide">
    <div class="ohead">OVERRUN</div>
    <div class="orank" id="oRank">D</div>
    <div class="ostats">
      <div class="ostat"><span class="v" id="oTime">0:00</span><span class="l">Survived</span></div>
      <div class="ostat"><span class="v" id="oScore">0</span><span class="l">Score</span></div>
      <div class="ostat"><span class="v" id="oKills">0</span><span class="l">Kills</span></div>
      <div class="ostat"><span class="v" id="oLevel">1</span><span class="l">Level</span></div>
      <div class="ostat"><span class="v" id="oCombo">0</span><span class="l">Best Combo</span></div>
      <div class="ostat"><span class="v" id="oWave">1</span><span class="l">Wave</span></div>
    </div>
    <div id="bestTag"></div>
    <div id="nearMiss" class="nearmiss"></div>
    <div class="overbtns">
      <button class="btn" id="againBtn">Play Again</button>
      <button class="btn ghost" id="shareBtn">Share</button>
    </div>
  </div>

  <!-- Pause -->
  <div id="pause" class="screen hide">
    <div class="title" style="font-size:clamp(40px,9vw,80px)">PAUSED</div>
    <button class="btn" id="resumeBtn">Resume</button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
